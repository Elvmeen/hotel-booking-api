services:
  - type: web
    name: hotel-booking-api
    runtime: docker
    plan: free
    envVars:
      - key: CI_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
    healthCheckPath: /
